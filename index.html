<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="רינגל — הכרויות ליהודים דתיים ומסורתיים. אנשים בסטנדרטים שלך."
    />
    <meta name="theme-color" content="#006AFF" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-48.png" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Outfit:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <title>רינגל — הכרויות ליהודים דתיים ומסורתיים</title>
    <script>
      (function () {
        var lang = "en";
        try {
          var saved = localStorage.getItem("ringle-lang");
          if (saved === "he" || saved === "en") {
            lang = saved;
          } else {
            var primary = (navigator.languages && navigator.languages[0]) || navigator.language || "";
            if (/^he\b/i.test(primary)) lang = "he";
          }
        } catch (error) {}
        var root = document.documentElement;
        root.lang = lang;
        root.dir = lang === "he" ? "rtl" : "ltr";
        document.title = lang === "he"
          ? "רינגל — הכרויות ליהודים דתיים ומסורתיים"
          : "Ringle — Dating for Religious & Traditional Jews";
        var meta = document.querySelector('meta[name="description"]');
        if (meta) {
          meta.setAttribute(
            "content",
            lang === "he"
              ? "רינגל — הכרויות ליהודים דתיים ומסורתיים. אנשים בסטנדרטים שלך."
              : "Ringle — dating for religious and traditional Jews. People at your standards."
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
